# Nightly full regression (§114), sharded 4× across chromium
name: Nightly Regression
on:
  schedule: [{ cron: "0 2 * * *" }]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
        shard: [1/4, 2/4, 3/4, 4/4]
    env:
      TEST_ENV: ${{ vars.TEST_ENV || 'qa' }}
      BASE_URL: ${{ vars.BASE_URL }}
      INTEGRATIONS_MODE: ${{ vars.INTEGRATIONS_MODE || 'mock' }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_NAME: ${{ github.workflow }}-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --grep "@regression" --shard=${{ matrix.shard }} --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: regression-${{ matrix.browser }}-${{ strategy.job-index }}
          path: |
            reports/
            test-results/
          retention-days: 14
