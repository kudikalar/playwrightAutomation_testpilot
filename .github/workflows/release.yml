# Release pipeline (§115): deploy QA → smoke → regression → cross-browser → quality gate → promote
name: Release
on:
  workflow_dispatch:
    inputs: { version: { description: "Release version", required: true } }
jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ vars.TEST_ENV || 'qa' }}
      BASE_URL: ${{ vars.BASE_URL }}
      INTEGRATIONS_MODE: ${{ vars.INTEGRATIONS_MODE || 'mock' }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_NAME: ${{ github.workflow }}-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --grep "@smoke"
  regression:
    needs: smoke
    runs-on: ubuntu-latest
    strategy: { matrix: { browser: [chromium] } }
    env:
      TEST_ENV: ${{ vars.TEST_ENV || 'qa' }}
      BASE_URL: ${{ vars.BASE_URL }}
      INTEGRATIONS_MODE: ${{ vars.INTEGRATIONS_MODE || 'mock' }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_NAME: ${{ github.workflow }}-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npx playwright test --grep "@regression" --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: release-${{ matrix.browser }}
          path: |
            reports/
            test-results/
          retention-days: 14
  gate:
    needs: regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: echo "All release gates passed for ${{ inputs.version }} — promoting."
